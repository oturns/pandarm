[build-system]
# scikit-build-core drives the CMake build; nanobind provides the C++ binding
# headers; setuptools_scm is retained for VCS-based versioning via the
# scikit_build_core.metadata.setuptools_scm dynamic-metadata provider.
build-backend = "scikit_build_core.build"
requires = [
    "scikit-build-core>=0.10",
    "setuptools_scm[toml]>=8",
    "nanobind>=2.0",
    "numpy>=2.0",
]

[tool.scikit-build]
minimum-version = "0.10"
cmake.build-type = "Release"
# Ship the setuptools-scm generated _version.py in the wheel
sdist.include = ["pandarm/_version.py"]
# Tell CMake where to find the package (pandarm/ sits at repo root)
wheel.packages = ["pandarm"]

# setuptools_scm writes version to pandarm/_version.py
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]
write_to = "pandarm/_version.py"

[project]
name = "pandarm"
dynamic = ["version"]
description = "The Pandas Routing Machine"
readme = "README.md"
keywords = ["routing, network analysis, accessibility, shortest paths, isochrone"]
dependencies = [
    "geopandas >=1.1",
    "numpy >=1.26",
    "pandas >=2.2",
    "scikit-learn >=1.4",
    "tables >=3.10",
]
classifiers = [
    "Programming Language :: Python :: 3",
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"

[project.urls]
Home = "https://github.com/oturns/pandarm/"
Repository = "https://github.com/oturns/pandarm"



[project.optional-dependencies]
plus = [
    "osmnx >=2.0",
]
dev = [
    "codecov",
    "pre-commit",
    "pytest",
    "pytest-cov",
]
docs = [
    "myst-parser",
    "nbsphinx",
    "numpydoc",
    "sphinx",
    "sphinxcontrib-bibtex",
    "sphinx_bootstrap_theme",
]
all = [
    "pandarm[plus,dev,docs]"
]


[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "N", "B", "A", "C4", "SIM", "ARG"]


[tool.coverage.run]
source = ["./pandarm"]

[tool.coverage.report]
exclude_lines = [
    "if self.debug:",
    "pragma: no cover",
    "raise NotImplementedError",
    "except ModuleNotFoundError:",
    "except ImportError",
]