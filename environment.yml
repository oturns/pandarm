name: pandarm
channels:
  - conda-forge
dependencies:
  - python
  - cxx-compiler  # platform-appropriate compiler w/ OpenMP
  - cmake
  - ninja
  - nanobind
  - scikit-build-core
  - setuptools_scm
  - geopandas >=1.1
  - numpy >=2
  - pandas >=2
  - pytables >=3.1
  - scikit-learn >=0.18

  # plus
  - osmnx

  # dev
  - codecov
  - pytest
  - pytest-cov
